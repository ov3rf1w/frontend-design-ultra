<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reference scanner contract fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font: 16px/1.5 system-ui, sans-serif; background: #111; color: #fff; }
      #custom-scroll-root { width: 100%; height: 100%; overflow-y: auto; scroll-behavior: auto; }
      section { min-height: 100%; display: grid; place-items: center; padding: 4rem; }
      section:nth-child(2n) { background: #eee; color: #111; }
      h1 { opacity: 0; transform: translateY(40px); }
      @media (prefers-reduced-motion: reduce) {
        h1 { opacity: 1 !important; transform: none !important; }
      }
    </style>
  </head>
  <body>
    <main id="custom-scroll-root" data-scroll-container>
      <section><h1>Entrance state</h1></section>
      <section><h2>Second chapter</h2></section>
      <section><h2>Third chapter</h2></section>
      <section><h2>Final chapter</h2></section>
    </main>
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const heading = document.querySelector("h1");
        const start = performance.now();
        const tick = (now) => {
          const progress = Math.min(1, (now - start) / 500);
          heading.style.opacity = String(progress);
          heading.style.transform = `translateY(${40 * (1 - progress)}px)`;
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
