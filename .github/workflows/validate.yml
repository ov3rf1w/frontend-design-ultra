name: Validate release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run deterministic tests
        run: npm test

      - name: Validate release surface
        run: npm run build

      - name: Validate Bash installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/frontend-design-ultra-codex
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash install.sh --local --dry-run

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_HOME: ${{ runner.temp }}\frontend-design-ultra-codex
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath .\install.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath .\uninstall.ps1))
          .\install.ps1 -Source Local -DryRun
