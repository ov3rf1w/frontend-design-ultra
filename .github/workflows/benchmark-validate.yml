name: Validate benchmark protocol

on:
  push:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-validate.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-validate.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate frozen protocol
        run: npm run benchmark:validate

      - name: Run benchmark tooling tests
        run: npm run benchmark:test
