name: Validate benchmark protocol

on:
  push:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-validate.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-validate.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate frozen protocol
        run: npm run benchmark:validate

      - name: Run benchmark tooling tests
        run: npm run benchmark:test
